name: Verification

on:
  push:
  pull_request:

jobs:
  verify:
    name: Static, Unit, And Browser Checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Meteor 3.5.1
        run: |
          curl --fail --location "https://install.meteor.com/?release=3.5.1" | sh
          echo "$HOME/.meteor" >> "$GITHUB_PATH"

      - name: Verify Meteor Version
        run: |
          meteor --version
          test "$(meteor --version)" = "Meteor 3.5.1"

      - name: Install Dependencies
        run: meteor npm ci

      - name: Install Playwright Chromium
        run: meteor npm exec playwright -- install --with-deps chromium

      - name: Check Formatting
        run: meteor npm run format:check

      - name: Lint Code
        run: meteor npm run lint

      - name: Check Project Invariants
        run: meteor npm run lint:project

      - name: Typecheck
        run: meteor npm run typecheck

      - name: Run Unit Tests
        run: meteor npm run test:unit

      - name: Run Integration Tests
        run: meteor npm run test:integration

      - name: Run Browser Smoke Tests
        run: meteor npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
